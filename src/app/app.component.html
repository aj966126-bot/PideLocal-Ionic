
<ion-app>

  <ion-split-pane
    contentId="contenido-principal"
    when="lg"
    [disabled]="esLogin">

    <ion-menu
      menuId="principal"
      contentId="contenido-principal"
      type="overlay"
      side="start"
      [disabled]="esLogin">

      <ion-header class="encabezado-menu">

        <ion-toolbar>

          <div class="marca-menu">

            <div class="icono-marca">
              <ion-icon name="location-outline"></ion-icon>
            </div>

            <div class="texto-marca">
              <h2>Pide<span>Local</span></h2>
              <p>Sabores cerca de ti</p>
            </div>

          </div>

        </ion-toolbar>

      </ion-header>

      <ion-content class="contenido-menu">

        <div class="bienvenida-menu">

          <div class="avatar-menu">
            <ion-icon name="person-outline"></ion-icon>
          </div>

          <div>
            <small>Bienvenida</small>
            <h3>María</h3>
            <p>Cuenta de demostración</p>
          </div>

        </div>

        <p class="titulo-opciones">NAVEGACIÓN</p>

        <ion-list class="lista-opciones">

          <ion-item
            *ngFor="let opcion of opciones"
            button
            detail="false"
            lines="none"
            class="opcion-menu"
            [class.activa]="estaSeleccionada(opcion)"
            (click)="navegar(opcion.ruta)">

            <ion-icon
              slot="start"
              [name]="opcion.icono">
            </ion-icon>

            <span>{{ opcion.titulo }}</span>

            <ion-icon
              slot="end"
              class="flecha"
              name="chevron-forward-outline">
            </ion-icon>

          </ion-item>

        </ion-list>

        <div class="final-menu">

          <ion-item
            button
            detail="false"
            lines="none"
            class="opcion-menu salir"
            (click)="cerrarSesion()">

            <ion-icon
              slot="start"
              name="log-out-outline">
            </ion-icon>

            <span>Volver al acceso</span>

          </ion-item>

          <div class="nota-menu">
            <strong>PideLocal</strong>
            <p>
              Prototipo académico desarrollado
              con Ionic y Angular.
            </p>
          </div>

        </div>

      </ion-content>

    </ion-menu>

    <ion-router-outlet
      id="contenido-principal">
    </ion-router-outlet>

  </ion-split-pane>

  <button
    *ngIf="!esLogin"
    type="button"
    class="boton-menu-global"
    aria-label="Abrir menú lateral"
    (click)="abrirMenu()">

    <ion-icon name="menu-outline"></ion-icon>

  </button>

</ion-app>
